<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLY WebGL Viewer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020817; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #viewer-toolbar { position: fixed; z-index: 2; top: 12px; left: 12px; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px); color: #e2e8f0; font: 13px sans-serif; }
    #model-list-panel { position: fixed; z-index: 2; top: 12px; left: 160px; width: min(250px, calc(100vw - 24px)); height: min(320px, calc(100vh - 24px)); box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid #48656a; border-radius: 5px; background: rgba(12, 22, 30, 0.94); color: #e2e8f0; font: 12px sans-serif; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28); }
    #model-list-header { display: flex; align-items: center; justify-content: space-between; min-height: 36px; padding: 0 8px 0 10px; border-bottom: 1px solid #30464a; font-weight: 600; }
    #toggle-model-list { width: 26px; height: 26px; border: 1px solid #527c7c; border-radius: 3px; background: #183437; color: #effafa; font: 18px/1 sans-serif; cursor: pointer; }
    #toggle-model-list:hover { background: #24494b; }
    #model-list { flex: 1; min-height: 0; margin: 0; padding: 4px 0; list-style: none; overflow: auto; }
    .model-entry label { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; cursor: pointer; }
    .model-entry label:hover { background: #1b3035; }
    .model-entry input { accent-color: #60b6a5; }
    .model-entry { display: flex; align-items: center; gap: 6px; padding-right: 6px; }
    .model-entry label { flex: 1; min-width: 0; }
    .model-entry span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-model { flex: 0 0 28px; width: 28px; height: 28px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #f0a49a; font: 20px/1 sans-serif; cursor: pointer; }
    .remove-model:hover { border-color: #854c49; background: #482d30; }
    #remove-model-dialog { width: min(360px, calc(100vw - 48px)); box-sizing: border-box; border: 1px solid #48656a; border-radius: 6px; padding: 18px; background: #101c24; color: #e2e8f0; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
    #remove-model-dialog::backdrop { background: rgba(0, 0, 0, 0.62); }
    #remove-model-dialog h2 { margin: 0 0 10px; font-size: 16px; }
    #remove-model-dialog p { margin: 0; color: #b8c9cc; overflow-wrap: anywhere; }
    #remove-model-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    #remove-model-dialog-actions button { border: 1px solid #527c7c; border-radius: 4px; padding: 7px 10px; background: #183437; color: #effafa; font: inherit; cursor: pointer; }
    #confirm-remove-model { border-color: #99534d !important; background: #512f32 !important; }
    #model-list-panel.collapsed { height: auto; }
    #model-list-panel.collapsed #model-list { display: none; }
    #open-ply { border: 1px solid #527c7c; border-radius: 4px; padding: 7px 11px; background: #183437; color: #effafa; font: inherit; cursor: pointer; }
    #open-ply:hover { background: #24494b; }
    #viewer-status { position: fixed; z-index: 1; top: 56px; left: 12px; color: #e2e8f0; font: 13px sans-serif; }
    #model-info { position: fixed; z-index: 2; top: 12px; right: 12px; width: min(220px, calc(100vw - 24px)); box-sizing: border-box; border: 1px solid #48656a; border-radius: 5px; background: rgba(12, 22, 30, 0.94); color: #e2e8f0; font: 12px sans-serif; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28); }
    #model-info-header { display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 8px 0 10px; font-weight: 600; }
    #toggle-model-info { width: 26px; height: 26px; border: 1px solid #527c7c; border-radius: 3px; background: #183437; color: #effafa; font: 18px/1 sans-serif; cursor: pointer; }
    #toggle-model-info:hover { background: #24494b; }
    #model-info-content { margin: 0; padding: 0 10px 9px; }
    #model-info-content > div { display: flex; justify-content: space-between; gap: 12px; padding-top: 5px; }
    #model-info-content dt { color: #a9c0c2; }
    #model-info-content dd { margin: 0; font-variant-numeric: tabular-nums; }
    #model-info.collapsed #model-info-content { display: none; }
    @media (max-width: 620px) { #model-list-panel { top: 56px; left: 12px; width: min(250px, calc(100vw - 24px)); height: min(240px, calc(100vh - 68px)); } }
  </style>
  <script type="importmap">
    {"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
  </script>
</head>
<body>
  <canvas id="viewer" tabindex="0"></canvas>
  <div id="viewer-toolbar">
    <button id="open-ply" type="button">PLY-Datei öffnen</button>
    <input id="ply-file-picker" type="file" accept=".ply" multiple hidden>
  </div>
  <div id="viewer-status" role="status">PLY-Datei auswählen.</div>
  <aside id="model-list-panel" aria-label="Geladene PLY-Modelle">
    <header id="model-list-header">
      <span>Modelle</span>
      <button id="toggle-model-list" type="button" aria-label="Modellliste minimieren" aria-expanded="true" title="Minimieren">−</button>
    </header>
    <ul id="model-list"></ul>
  </aside>
  <dialog id="remove-model-dialog" aria-labelledby="remove-model-title">
    <h2 id="remove-model-title">Modell entfernen?</h2>
    <p><strong id="remove-model-name"></strong> aus dem Viewer entfernen?</p>
    <div id="remove-model-dialog-actions">
      <button id="cancel-remove-model" type="button">Abbrechen</button>
      <button id="confirm-remove-model" type="button">Modell entfernen</button>
    </div>
  </dialog>
  <section id="model-info" aria-label="PLY-Modelldaten">
    <header id="model-info-header">
      <span>Modelldaten</span>
      <button id="toggle-model-info" type="button" aria-label="Modelldaten minimieren" aria-expanded="true" title="Minimieren">−</button>
    </header>
    <dl id="model-info-content">
      <div><dt>Punkte</dt><dd id="point-count">—</dd></div>
      <div><dt>Ausdehnung X</dt><dd id="dimension-x">—</dd></div>
      <div><dt>Ausdehnung Y</dt><dd id="dimension-y">—</dd></div>
      <div><dt>Ausdehnung Z</dt><dd id="dimension-z">—</dd></div>
    </dl>
  </section>
  <script id="ply-url" type="application/json">""</script>
  <script type="module" src="./out/webview/index.js"></script>
</body>
</html>
